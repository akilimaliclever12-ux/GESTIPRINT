name: Release — APK Android + Desktop Windows

# Déclenché en poussant un tag "vX.Y.Z" (ex : git tag v1.0.0 && git push --tags),
# ou manuellement (Actions → Run workflow). Les binaires sont attachés à la
# Release GitHub correspondante (et toujours disponibles en artefacts du run).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances + build web
        run: |
          npm ci
          npm run build
      - name: Générer le projet Android (Capacitor)
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Icônes de l'app Android (depuis le logo)
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#14192e'
      - name: Compiler l'APK (debug, installable)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../gestiprint.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gestiprint-apk
          path: gestiprint.apk
      - name: Publier dans la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gestiprint.apk

  desktop:
    name: Desktop Windows (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Installer les dépendances
        run: npm ci
      - name: Générer les icônes de l'app (depuis le logo)
        run: npx tauri icon public/gesp.png
      - name: Compiler l'installateur Windows (Tauri)
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: gestiprint-windows
          path: client/src-tauri/target/release/bundle/nsis/*.exe
      - name: Publier dans la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: client/src-tauri/target/release/bundle/nsis/*.exe

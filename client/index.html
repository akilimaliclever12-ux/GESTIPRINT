<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/gesp.png" />
    <link rel="apple-touch-icon" href="/gesp.png" />
    <meta name="theme-color" content="#0A69AC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Capture the install prompt early — Chrome fires beforeinstallprompt
      // before React mounts; stash it for the InstallButton/InstallGate.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__bipEvent = e;
        window.dispatchEvent(new Event('pwa-can-install'));
      });
      window.addEventListener('appinstalled', function () {
        window.__bipEvent = null;
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>GestiPrint — Gestion d'imprimerie (RDC & Burundi)</title>
    <meta
      name="description"
      content="GestiPrint : logiciel de gestion pour imprimeries et centres de reprographie. Commandes, clients, dettes, caisse et dépenses — hors ligne, en USD, FC et BIF."
    />
    <meta name="author" content="GestiPrint" />
    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
